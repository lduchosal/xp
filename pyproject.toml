[project]
name = "conson-xp"
dynamic = ["version"]
description = "XP Protocol Communication Tools"
authors = [
    {name = "ldvchosal", email = "ldvchosal@github.com"},
]
dependencies = [
    "click>=8.3",
    "click-help-colors>=0.9",
    "pyyaml>=6.0",
    "structlog>=22.0",
    "fastapi>=0.118",
    "uvicorn>=0.37",
    "pydantic>=2.11",
    "HAP-python[QRCode]>=5.0.0",
    "punq>=0.7.0",
    "twisted>=25.5.0",
    "psygnal>=0.15.0",
    "textual>=1.0.0",
    "python-statemachine>=2.5.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}

[project.urls]
"Homepage" = "https://github.com/lduchosal/xp"
"Bug Reports" = "https://github.com/lduchosal/xp/issues"
"Source" = "https://github.com/lduchosal/xp"

[project.scripts]
xp = "xp.cli:cli"

[dependency-groups]
dev = [
    "pdm>=2.26.0",
    "pdm-bump>=0.9.0",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "mypy>=1.18,<1.20",
    "ruff>=0.16",
    "vulture>=2.14",
    "httpx>=0.24.0",
    "twine>=6.2.0",
    "types-PyYAML",
    "pdm-backend>=2.4.5",
    "pytest-asyncio>=1.2.0",
    "types-docutils>=0.22.2.20251006",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "reverseproxy: marks tests as unit tests",
    "asyncio: marks tests as asyncio tests",
]
filterwarnings = [
      "ignore::DeprecationWarning:click_help_colors.*",
  ]

[tool.coverage.run]
source = ["src/xp"]
omit = ["tests/*", "src/xp/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# Qualité maximale : toutes les règles stables, y compris celles que les
# futures versions de ruff stabiliseront (ALL grandit automatiquement).
select = ["ALL"]
# Règles preview : opt-in explicite (extend-select) tant qu'elles ne sont pas
# stabilisées ; une fois stables, ALL les absorbe automatiquement.
preview = true
explicit-preview-rules = true
extend-select = [
    # pydoclint : docstrings complètes (remplace flake8-docstrings-complete).
    # Codes exacts requis : explicit-preview-rules ignore les préfixes de groupe.
    "DOC102",
    "DOC201",
    "DOC202",
    "DOC402",
    "DOC403",
    "DOC501",
    "DOC502",
    "PLW1514", # encoding explicite sur open()
    "PLC1901", # comparaison à chaîne vide
    "PLR6201", # appartenance via set littéral
    "D421",    # docstrings de propriétés
    "PLC2801", # appels dunder inutiles
    "RUF052",  # variables dummy utilisées
    "SIM113",  # enumerate
]
ignore = [
    # Paires déclarées incompatibles par ruff : un style par paire.
    "D203", # incompatible avec D211 (pas de ligne vide avant docstring de classe)
    "D213", # incompatible avec D212 (résumé sur la première ligne)
    # Redondants avec `ruff format`, désactivation recommandée par ruff.
    "COM812",
    "ISC001",
]

[tool.ruff.lint.isort]
known-first-party = ["xp"]

[tool.ruff.lint.per-file-ignores]
# pytest repose sur des `assert` nus : S101 n'a pas de sens dans les tests.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
disable_error_code = ["method-assign"]

[tool.pdm]
distribution = true
version = {source = "file", path = "src/xp/__init__.py"}

[tool.pdm.scripts]
test = "env PYTHONPATH=src python -m pytest tests/ -v --cov=src/xp --cov-report=term-missing"
test-quick = "env PYTHONPATH=src python -m pytest tests/ --tb=short -qq"
test-ci = "env PYTHONPATH=src python -m pytest tests/ -v --cov=src/xp --cov-branch --cov-report=xml -m 'not reverseproxy'"
test-unit = "env PYTHONPATH=src python -m pytest tests/unit/ -v"
test-integration = "env PYTHONPATH=src python -m pytest tests/integration/ -v"
test-cov = "env PYTHONPATH=src python -m pytest tests/ --quiet --cov=src/xp --cov-report=html --cov-report=term-missing --cov-fail-under=75"
lint = "ruff check --fix src/ tests/"
lint-check = "ruff check src/ tests/"
format = "ruff format src/ tests/"
format-check = "ruff format --check src/ tests/"
typecheck = "mypy src/ tests/"
vulture = "vulture src/ tests/"
quality = {composite = ["lint-check", "format-check", "typecheck", "vulture"]}
update-readme = {shell = "xp help > /tmp/xp-help.txt && if [ \"$(uname)\" = \"Darwin\" ]; then sed -i '' -e '/<!-- BEGIN CLI HELP -->/,/<!-- END CLI HELP -->/{//!d;}' -e '/<!-- BEGIN CLI HELP -->/r /tmp/xp-help.txt' README.md; else sed -i -e '/<!-- BEGIN CLI HELP -->/,/<!-- END CLI HELP -->/{//!d;}' -e '/<!-- BEGIN CLI HELP -->/r /tmp/xp-help.txt' README.md; fi && rm /tmp/xp-help.txt"}
check = {composite = ["clean", "lint", "format", "typecheck", "vulture", "test-quick", "test-cov", "update-readme"] }
bump-version = "pdm bump -v minor"
env = "echo ${PATH}"
install = "pdm install"
install-dev = "pdm install -G dev"
clean = {shell = "rm -rf .coverage coverage.xml htmlcov/ .pytest_cache/ log/conbus.log.* log log.* && find . -type d -name '__pycache__' -exec rm -rf {} +"}
version-show = "python -c 'import xp; print(xp.__version__)'"
version-patch = "pdm bump patch"
version-minor = "pdm bump minor"
version-major = "pdm bump major"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.vulture]
exclude = ["src/xp/cli"]
ignore_decorators = ["@click"]
make_whitelist = true
min_confidence = 80
paths = ["src", "tests"]
sort_by_size = true
verbose = false

[tool.pdm-bump]
version-files = [
    "src/xp/__init__.py:__version__",
]

